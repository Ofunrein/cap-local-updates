name: Build and release Cap 2

on:
  workflow_run:
    workflows: ["Sync upstream Cap"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cap2-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CAP2_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.CAP2_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_SERVER_URL: http://127.0.0.1:3000
      VITE_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip commits already released
        id: guard
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          BODY=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .body 2>/dev/null || true)
          if grep -q "Upstream-Commit: $SHA" <<<"$BODY"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Apply Cap 2 overlay and version
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git apply --check .cap2/cap2.patch
          git apply .cap2/cap2.patch
          BASE=$(python3 - <<'PY'
          import re
          text=open('apps/desktop/src-tauri/Cargo.toml').read()
          print(re.search(r'^version = "([^"]+)"', text, re.M).group(1))
          PY
          )
          VERSION=$(python3 - "$BASE" <<'PY'
          import datetime,re,sys
          m=re.match(r'(\d+)\.(\d+)\.(\d+)',sys.argv[1])
          if not m: raise SystemExit('unsupported upstream version')
          a,b,_=map(int,m.groups())
          print(f'{a}.{b}.{datetime.datetime.now(datetime.timezone.utc):%Y%m%d%H%M}')
          PY
          )
          python3 - "$VERSION" <<'PY'
          import re,sys
          for p in ('apps/desktop/src-tauri/Cargo.toml','Cargo.lock'):
              s=open(p).read()
              if p == 'Cargo.lock':
                  s=re.sub(r'(name = "cap-desktop"\nversion = ")[^"]+', r'\g<1>'+sys.argv[1], s, count=1)
              else:
                  s=re.sub(r'^version = "[^"]+"', f'version = "{sys.argv[1]}"', s, count=1, flags=re.M)
              open(p,'w').write(s)
          PY
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.guard.outputs.skip != 'true'
        with:
          shared-key: aarch64-apple-darwin
          cache-bin: false
          cache-on-failure: true

      - name: Block known compromised npm releases
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          lock = Path("pnpm-lock.yaml").read_text()
          compromised = [
              "keyv@6.0.0",
              "flat-cache@6.1.24",
              "file-entry-cache@11.1.6",
              "cacheable-request@13.0.20",
              "cacheable@2.5.1",
              "@cacheable/utils@2.5.1",
              "cache-manager@7.2.10",
              "@cacheable/net@2.1.1",
              "@cacheable/node-cache@3.1.2",
              "@cacheable/memory@2.2.1",
              "ecto@5.0.1",
          ]
          found = [p for p in compromised if re.search(rf"(?m)^\s{{2}}{re.escape(p)}:", lock)]
          if found:
              raise SystemExit("Compromised npm releases in lockfile: " + ", ".join(found))
          print("No known ChainDrop releases in pnpm-lock.yaml")
          PY
          if git grep -n -E 'Math_Symbol\.js|gh-token-monitor|com\.user\.gh-token-monitor' -- . ':!pnpm-lock.yaml' ':!.github/workflows/cap2-release.yml'; then
            echo "ChainDrop indicator found in repository" >&2
            exit 1
          fi

      - name: Install native and JavaScript dependencies
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          brew install ffmpeg@7
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg@7)" >> "$GITHUB_ENV"
          # Never execute dependency lifecycle scripts during release installation.
          # Project-controlled native setup runs explicitly in the next step.
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare pinned native dependencies
        if: steps.guard.outputs.skip != 'true'
        env:
          RUST_TARGET_TRIPLE: aarch64-apple-darwin
        run: |
          touch .env
          pnpm -w cap-setup

      - name: Build Cap 2
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$FFMPEG_DIR/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LIBRARY_PATH="$FFMPEG_DIR/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          ./scripts/build-desktop-binaries.sh aarch64-apple-darwin
          cd apps/desktop
          pnpm tauri build --debug --config src-tauri/tauri.cap2.conf.json --bundles app

      - name: Sign bundle and updater package
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          CAP2_CODESIGN_P12: ${{ secrets.CAP2_CODESIGN_P12 }}
          CAP2_CODESIGN_P12_PASSWORD: ${{ secrets.CAP2_CODESIGN_P12_PASSWORD }}
        run: |
          APP="target/debug/bundle/macos/Cap 2.app"
          ARCHIVE="target/debug/bundle/macos/Cap.2_${VERSION}_aarch64.app.tar.gz"
          ZIP="$RUNNER_TEMP/Cap-2-${VERSION}-macOS-arm64.zip"
          # Sign with a stable identity, not ad-hoc. macOS keys TCC grants (Screen Recording,
          # Accessibility) to the signing cert; an ad-hoc signature keys them to the binary hash,
          # so every update would wipe the grants and re-show the permissions screen.
          KEYCHAIN=""
          IDENTITY="-"
          if [ -n "$CAP2_CODESIGN_P12" ]; then
            KEYCHAIN="$RUNNER_TEMP/cap2-signing.keychain-db"
            KCPASS=$(openssl rand -hex 24)
            printf '%s' "$CAP2_CODESIGN_P12" | base64 -d > "$RUNNER_TEMP/cap2.p12"
            security create-keychain -p "$KCPASS" "$KEYCHAIN"
            security set-keychain-settings -lut 3600 "$KEYCHAIN"
            security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cap2.p12" -k "$KEYCHAIN" -P "$CAP2_CODESIGN_P12_PASSWORD" -T /usr/bin/codesign -A
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 {print $2}')
            rm -f "$RUNNER_TEMP/cap2.p12"
            [ -n "$IDENTITY" ] || { echo "::error::no codesigning identity found in CAP2_CODESIGN_P12"; exit 1; }
          else
            echo "::warning::CAP2_CODESIGN_P12 unset - ad-hoc signing; macOS permissions will reset after this update"
          fi
          sign() { codesign --force --timestamp=none ${KEYCHAIN:+--keychain "$KEYCHAIN"} -s "$IDENTITY" "$1"; }
          for b in cap-cli cap-exporter cap-muxer; do
            [ -f "$APP/Contents/MacOS/$b" ] && sign "$APP/Contents/MacOS/$b"
          done
          while IFS= read -r -d '' f; do sign "$f"; done < <(find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' -print0 2>/dev/null)
          sign "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d -r- "$APP" 2>&1 | tail -1
          tar -C "$(dirname "$APP")" -czf "$ARCHIVE" "$(basename "$APP")"
          pnpm --dir apps/desktop tauri signer sign "$PWD/$ARCHIVE"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          echo "APP_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "APP_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create signed release and updater manifest
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cap2-v${VERSION}-u${UPSTREAM_SHA:0:7}"
          ASSET=$(basename "$APP_ARCHIVE")
          SIG=$(tr -d '\n' < "$APP_ARCHIVE.sig")
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
          python3 - "$VERSION" "$SIG" "$URL" > "$RUNNER_TEMP/latest.json" <<'PY'
          import datetime,json,sys
          version,signature,url=sys.argv[1:]
          print(json.dumps({'version':version,'notes':f'Cap 2 {version}','pub_date':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),'platforms':{'darwin-aarch64':{'signature':signature,'url':url}}},indent=2))
          PY
          gh release create "$TAG" "$APP_ARCHIVE" "$APP_ARCHIVE.sig" "$APP_ZIP" "$RUNNER_TEMP/latest.json" \
            --target "$UPSTREAM_SHA" --title "Cap 2 $VERSION" \
            --notes $'Automated Cap 2 build.\n\nUpstream-Commit: '"$UPSTREAM_SHA"$'\nCap2-Version: '"$VERSION"